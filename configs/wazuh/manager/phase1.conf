<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>yes</logall_json>
    <email_notification>no</email_notification>
    <agents_disconnection_time>2m</agents_disconnection_time>
    <agents_disconnection_alert_time>1m</agents_disconnection_alert_time>
  </global>
  <logging><log_format>plain</log_format></logging>
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>16384</queue_size>
  </remote>
  <!-- Enrollment is offline/manual; no unauthenticated registration listener. -->
  <auth><disabled>yes</disabled></auth>
  <indexer><enabled>no</enabled></indexer>
  <vulnerability-detection><enabled>no</enabled></vulnerability-detection>
  <rootcheck><disabled>yes</disabled></rootcheck>
  <syscheck><disabled>yes</disabled></syscheck>
  <sca><enabled>no</enabled></sca>
  <alerts><log_alert_level>3</log_alert_level></alerts>
  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/security-eventchannel</list>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>
</ossec_config>
